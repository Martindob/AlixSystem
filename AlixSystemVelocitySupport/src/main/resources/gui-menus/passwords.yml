#--------------------------------------------------------------------------------------------#
#                    Passwords menu - configurable positions & actions                        #
#--------------------------------------------------------------------------------------------#
#
# This file controls the Passwords sub-menu (opened from /account). The menu SIZE (18 slots,
# a 9x2 grid) is fixed. Every button here has live, stateful behavior (cycling login types,
# opening the password-input sign, saving changes) so its slot position is configurable, but
# its appearance/behavior stays built-in - each entry below just needs "internal" + "slot".
#
# Valid internal ids:
#   login-type                - cycles the main login type (left/right click)
#   extra-login-type          - cycles the secondary login type (left/right click)
#   input-password             - opens the sign input to change the main password
#   input-secondary-password   - opens the sign input to change the secondary password
#   save-changes                - applies all pending changes made in this menu
#   back                        - returns to the menu that opened this one
#
# You can also add your own purely decorative or generic-action items anywhere else in the
# grid - see gui-menus/account.yml's comments for the full settings/actions reference.
#
# background.material / background.name - the filler item shown in every slot with no item assigned.

title: "@gui-title-passwords"

background.material: GRAY_STAINED_GLASS_PANE
background.name: "&f"

item-order:
  - login-type
  - extra-login-type
  - input-password
  - input-secondary-password
  - save-changes
  - back

items.login-type.slot: 0
items.login-type.internal: login-type

items.extra-login-type.slot: 1
items.extra-login-type.internal: extra-login-type

items.input-password.slot: 9
items.input-password.internal: input-password

items.input-secondary-password.slot: 10
items.input-secondary-password.internal: input-secondary-password

items.save-changes.slot: 17
items.save-changes.internal: save-changes

items.back.slot: 8
items.back.internal: back
