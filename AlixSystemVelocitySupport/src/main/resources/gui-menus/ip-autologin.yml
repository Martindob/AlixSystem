#--------------------------------------------------------------------------------------------#
#                  IP auto-login prompt - configurable positions & actions                    #
#--------------------------------------------------------------------------------------------#
#
# This file controls the IP auto-login accept/reject prompt. The menu SIZE (9 slots, a 3x3
# grid) is fixed.
#
# The "question-mark" item below is purely informational and fully configurable like a normal
# item (see gui-menus/account.yml's comments for the full settings/actions reference). The
# accept/reject buttons change live account data, so their appearance stays built-in - each
# just needs "internal" + "slot".
#
# Valid internal ids:
#   accept   - enables IP auto-login
#   reject    - disables IP auto-login
#
# background.material / background.name - the filler item shown in every slot with no item assigned.

title: "@gui-title-ip-autologin"

background.material: GRAY_STAINED_GLASS_PANE
background.name: "&f"

item-order:
  - question-mark
  - accept
  - reject

items.question-mark.slot: 1
items.question-mark.head-texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmFkYzA0OGE3Y2U3OGY3ZGFkNzJhMDdkYTI3ZDg1YzA5MTY4ODFlNTUyMmVlZWQxZTNkYWYyMTdhMzhjMWEifX19"
items.question-mark.name: "@gui-ip-autologin-question-mark"
items.question-mark.lore:
  - "@gui-ip-autologin-what-is-this"
items.question-mark.actions:
  - "[none]"

items.accept.slot: 6
items.accept.internal: accept

items.reject.slot: 8
items.reject.internal: reject
