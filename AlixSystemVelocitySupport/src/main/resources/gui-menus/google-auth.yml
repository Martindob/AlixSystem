#--------------------------------------------------------------------------------------------#
#              Two-Factor Authentication menu - configurable positions & actions              #
#--------------------------------------------------------------------------------------------#
#
# This file controls the Two-Factor Authentication sub-menu (opened from /account). The menu
# SIZE (27 slots, a 9x3 grid) is fixed.
#
# The "what-is-this" item below is purely informational and fully configurable like a normal
# item (see gui-menus/account.yml's comments for the full settings/actions reference). The
# other three buttons have live, stateful behavior (showing a QR code, cycling the auth type,
# applying changes), so their appearance stays built-in - each just needs "internal" + "slot".
#
# Valid internal ids:
#   show-qr          - generates and shows the Google Authenticator QR code
#   auth-type         - cycles the 2FA requirement (password / authenticator app / both)
#   apply-changes      - applies the selected changes
#   back                - returns to the menu that opened this one
#
# background.material / background.name - the filler item shown in every slot with no item assigned.

title: "@gui-title-google-auth"

background.material: GRAY_STAINED_GLASS_PANE
background.name: "&f"

item-order:
  - what-is-this
  - show-qr
  - auth-type
  - apply-changes
  - back

items.what-is-this.slot: 10
items.what-is-this.head-texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmMyNzEwNTI3MTllZjY0MDc5ZWU4YzE0OTg5NTEyMzhhNzRkYWM0YzI3Yjk1NjQwZGI2ZmJkZGMyZDZiNWI2ZSJ9fX0="
items.what-is-this.name: "@gui-google-auth-what-is-this-name"
items.what-is-this.lore:
  - "@gui-google-auth-what-is-this"
items.what-is-this.actions:
  - "[none]"

items.show-qr.slot: 13
items.show-qr.internal: show-qr

items.auth-type.slot: 16
items.auth-type.internal: auth-type

items.apply-changes.slot: 26
items.apply-changes.internal: apply-changes

items.back.slot: 8
items.back.internal: back
