#-------------------------------------------------------------------------------------------------#
#                        This config is used to set up the connection                             #
#                   to an SMTP server. This is useful if you want to give                         #
#                       your players the ability to add their own emails,                         #
#                    which can be used for account recovery or if you want                        #
#                             to connect them to your own website                                 #
#                                   For more info check out                                       #
#     https://github.com/ShadowOfHeaven-Me/AlixSystem/wiki/Account-Recovery-Email-Set%E2%80%90Up  #
#-------------------------------------------------------------------------------------------------#

#------------------------------------------------#
#                 SERVER SET-UP                  #
#------------------------------------------------#


username: account@gmail.com
sender: Alix
email: account@gmail.com

# Connection parameters
password:
host: smtp.gmail.com
# Usually either 587 (TLS) or 465 (SSL)
#Can also be set custom (will have SSL enabled)
port: 587

#------------------------------------------------#
#                USER EXPERIENCE                 #
#------------------------------------------------#


# Defines how many attempts does the user get during account recovery when entering the account's email, before being kicked out
max-email-attempts: 5
# Defines how many attempts does the user get when entering the recovery code, before being kicked out
max-code-attempts: 3